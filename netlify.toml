# ShibuMap — Netlify config.
#
# Functions: netlify/functions/race.mjs backs the `#r=<id>` share-link form
# (GPX-carrying links) via Netlify Blobs — see that file's own header for the
# full contract.
#
# ═════════════════════════════════════════════════════════════════════════════
# CETTE SECTION [build] NE SERT À RIEN AUJOURD'HUI — ET C'EST EXACTEMENT
# POURQUOI ELLE DOIT ÊTRE JUSTE
# ═════════════════════════════════════════════════════════════════════════════
#
# Le déploiement réel passe par `npm run deploy`, c'est-à-dire
# `netlify deploy --prod --dir dist` : la CLI TÉLÉVERSE un `dist/` déjà
# construit en local et N'EXÉCUTE PAS la commande ci-dessous (il faudrait
# `--build`). Cette section ne se réveillerait donc que le jour où quelqu'un
# branche une construction automatique depuis GitHub — et ce jour-là, personne
# ne relira ce fichier avant que le site soit en ligne.
#
# ⚠️ ELLE DISAIT `npx vite build` SEUL, ET C'ÉTAIT FAUX (corrigé le 2026-08-05).
# Le script `deploy` de package.json lance `build:mapcells` AVANT `vite build`.
# Sans lui, le découpage en cellules de public/data/map/ n'existe pas, le
# chargeur retombe sur les monolithes du monde entier, et les 34 % de poids
# gagnés le 2026-07-28 disparaissent SANS QU'AUCUN SIGNAL NE LE DISE.
#
# MESURÉ AVANT DE DÉCIDER (2026-08-05), parce qu'aligner à l'aveugle aurait pu
# être pire que ne rien faire :
#   · durée               5,8 s   (largement sous le plafond Netlify)
#   · réseau              AUCUN   (il ne lit que des fichiers locaux)
#   · sources             public/data/map/*.json — VERSIONNÉES (28 Mo), donc
#                         présentes dans un clone GitHub
#   · sortie              public/data/map/cells/ — hors dépôt, donc rien de
#                         versionné n'est écrasé
# Rien ne s'oppose à l'alignement : il est fait.
#
# ⚠️ MAIS L'ALIGNER NE SUFFIT PAS À RENDRE UNE CONSTRUCTION GITHUB VIABLE, et
# c'est le vrai piège de ce fichier. `build:mapcells` est la SEULE des sept
# couches de données cuites qui se régénère depuis le dépôt. Les six autres —
# data/bathy, coast-z6, lake-tiles, water-tiles, sol, canopee, plus d'un Go —
# sont hors dépôt et ne se refabriquent PAS ici (GEBCO, Overture, ETH…). Un
# clone GitHub neuf les a vides, `vite build` recopie ce vide dans `dist/`, et
# `netlify deploy --dir dist` REMPLACE TOUT LE SITE : il n'y a pas de fusion
# incrémentale. Le résultat n'est pas « un site plus lourd », c'est un site
# AMPUTÉ qui se charge normalement — la panne exacte, arrivée deux fois en
# production, que scripts/verifie-dist.mjs existe pour empêcher.
#
# D'où le troisième maillon : `verifie:dist` compte ce que `dist/` contient
# vraiment et sort en erreur s'il manque une couche. Sur une construction
# GitHub il ÉCHOUERA — et c'est le comportement voulu : mieux vaut une
# construction rouge qu'un site en ligne amputé que personne ne voit.
#
# ⚠️ Ne pas remettre `npx vite build` seul ici. Cette ligne doit rester le
# miroir du script `deploy` de package.json, moins l'appel à la CLI Netlify.

[build]
  command = "npm run build:mapcells && npx vite build && npm run verifie:dist"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# /templates : l'ancienne vitrine statique est remplacée par la boutique
# in-app (décision Adrien 2026-07-23) — l'app s'ouvre en mode boutique.
# force=true : prime sur tout fichier statique résiduel. Les assets
# téléchargeables restent servis sous /templates/assets/, et le catalogue
# de la boutique sous /templates/data.json.
[[redirects]]
  from = "/templates"
  to = "/?store=1"
  status = 302
  force = true

[[redirects]]
  from = "/templates/"
  to = "/?store=1"
  status = 302
  force = true
